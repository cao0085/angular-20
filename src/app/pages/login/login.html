<div class="login-container">
    <form (ngSubmit)="onSubmit()">
        <!-- <h2>Login In</h2> -->
        <div class="hint-box">
            <h3>Account</h3>
            <div><strong>admin</strong>/<strong>admin123</strong></div>
            <div><strong>user</strong>/<strong>user123</strong></div>
            <div><strong>test</strong>/<strong>test123</strong></div>
        </div>
        <div class="field">
            <label for="username">Account</label>
            <input id="username" type="text" pInputText [ngModel]="username()" (ngModelChange)="username.set($event)"
                name="username" class="w-full" />
        </div>

        <div class="field">
            <label for="password">Password</label>
            <p-password inputId="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password"
                [feedback]="false" [toggleMask]="true" styleClass="w-full"></p-password>
        </div>

        <!-- 登入按鈕 -->
        <p-button type="submit" label="Sumbit" severity="primary" [disabled]="!isFormValid()"
            styleClass="w-full"></p-button>
    </form>
</div>
